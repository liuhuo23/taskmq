[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmq"
version = "0.1.0"
description = "零外部服务、投递语义可预测、配置显式的 Python 分布式任务队列"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "taskmq" }]
keywords = ["task-queue", "celery", "sqlite", "worker", "distributed", "priority"]
dependencies = ["msgspec>=0.18"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
postgres = ["psycopg[binary]>=3.1"]
amqp = ["pika>=1.3"]

[project.scripts]
taskmq = "taskmq.cli:main"

# 开发依赖用 PEP 735 dependency-groups（uv 原生）。
[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "opentelemetry-api>=1.44.0",
    "psycopg[binary]>=3.3.6",
    "pika>=1.3",
]

[tool.uv]
default-groups = ["dev"]
# 只在这几个平台上解析/安装（CI 与本地一致）
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.setuptools.packages.find]
include = ["taskmq*"]

[tool.setuptools.package-data]
taskmq = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# pika（RabbitMQ）没有 py.typed / stubs → 只对这一个第三方库关掉"必须带类型"
[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
files = ["taskmq"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

# 编辑器（Pylance）默认引擎，与 mypy 一起跑，避免两边结论不一致
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["taskmq"]
