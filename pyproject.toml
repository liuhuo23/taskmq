[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 分发名 ≠ import 名：PyPI 上 `taskmq` 与已有的 `task-mq` 被判为"过于相似"（去分隔符后同名），
# 所以分发名用 `taskmq-py`；安装后依然是 `import taskmq` + `taskmq` 命令。
name = "taskmq-py"
version = "0.1.0"
description = "零外部服务、投递语义可预测、配置显式的 Python 分布式任务队列"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "liuhuo" }]
keywords = ["task-queue", "celery", "sqlite", "worker", "distributed", "priority"]
dependencies = [
  "msgspec>=0.18",
  # 3.9 缺 typing.ParamSpec / Concatenate；3.10+ 用标准库，不装
  'typing_extensions>=4.1.0; python_version < "3.10"',
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
postgres = ["psycopg[binary]>=3.1"]
amqp = ["pika>=1.3"]
# 开发依赖的 pip 入口（CI 会用 pip 装这一组跑全量测试，缺项会红）
# 与下面的 [dependency-groups].dev 保持一致：uv 走 group，pip 走 extra，两者内容必须相同。
dev = [
    # 约束刻意放松：要能在**最低支持版本 3.9** 上解析（3.10+ 会拿到更新版本）
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "opentelemetry-api>=1.20",
    "psycopg[binary]>=3.1",
    "pika>=1.3",
]

[project.urls]
Homepage = "https://github.com/liuhuo23/taskmq"
Documentation = "https://liuhuo23.github.io/taskmq/"
Repository = "https://github.com/liuhuo23/taskmq"
Changelog = "https://github.com/liuhuo23/taskmq/releases"
Issues = "https://github.com/liuhuo23/taskmq/issues"

[project.scripts]
taskmq = "taskmq.cli:main"

# 开发依赖用 PEP 735 dependency-groups（uv 原生）。内容与上面的 [project.optional-dependencies].dev 必须一致。
[dependency-groups]
dev = [
    # 约束刻意放松：要能在**最低支持版本 3.9** 上解析（3.10+ 会拿到更新版本）
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "opentelemetry-api>=1.20",
    "psycopg[binary]>=3.1",
    "pika>=1.3",
]

[tool.uv]
default-groups = ["dev"]
# 只在这几个平台上解析/安装（CI 与本地一致）
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.setuptools.packages.find]
include = ["taskmq*"]

[tool.setuptools.package-data]
taskmq = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# pika（RabbitMQ）没有 py.typed / stubs → 只对这一个第三方库关掉"必须带类型"
[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
ignore_missing_imports = true

[tool.mypy]
# 按**开发版本 3.10** 检查（mypy 2.x 也已不支持 3.9 目标）。
# 3.9 是运行时下限：由 CI 用真 3.9 跑全量测试来守，而不是把语言级别降到 3.9。
python_version = "3.10"
files = ["taskmq"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

# 编辑器（Pylance）默认引擎，与 mypy 一起跑，避免两边结论不一致
# venvPath/venv：让 pyright 直接用 .venv 解析第三方依赖，不依赖"谁把它拉起来"（uv run / python -m 都行）
[tool.pyright]
venvPath = "."
venv = ".venv"
# 同 mypy：按开发版本 3.10 检查；3.9 的兼容性由 CI 的真 3.9 测试保证
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["taskmq"]
